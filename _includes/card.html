<article class="card">

    {% if include.image %}
        <img src="{{ include.image }}" alt="{{ include.title }}">
    {% endif %}

    <h3>{{ include.title }}</h3>

    {% if include.description %}
        <p>{{ include.description }}</p>
    {% endif %}

    {% if include.button_text and include.button_url %}
        <a href="{{ include.button_url }}">
            {{ include.button_text }}
        </a>
    {% endif %}

</article>
