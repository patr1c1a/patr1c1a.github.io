<a class="card highlighted-product-card"
   href="{{ include.url }}">

    {% if include.type %}
        <div class="card-badge">
            {{ include.type }}
        </div>
    {% endif %}

    <h3>{{ include.title }}</h3>

    {% if include.metadata %}
        <ul class="product-metadata">
            {% for item in include.metadata %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <div class="highlighted-product-footer">

        <span class="highlighted-product-link">
            {{ include.link_text | default: "Más información" }}
        </span>

        <span class="card-arrow">
            →
        </span>

    </div>

</a>
