{% assign items = site.data.home_featured_posts.items %}

{% if items.size > 0 %}

<section class="home-section">

    <div class="section-header">
        <h2>Recursos destacados</h2>

        <a href="/blog/">
            Ver todos →
        </a>
    </div>

    <div class="cards-grid">

        {% for item in items %}

            {% include post_card.html
                title=item.title
                description=item.description
                image=item.image
                type=item.type
                button_url=item.url
            %}

        {% endfor %}

    </div>

</section>

{% endif %}
