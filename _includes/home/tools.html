{% assign items = site.data.tools.items %}

{% if items.size > 0 %}

<section class="home-section">

    <h2>Herramientas gratuitas</h2>

    <div class="tools-grid">
        {% for item in items %}
            {% include tool_card.html
                title=item.title
                description=item.description
                image=item.image
                button=item.button
                url=item.url
            %}
        {% endfor %}
    </div>

</section>

{% endif %}
