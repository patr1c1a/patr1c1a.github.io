<article class="card post-card">

    {% if include.image %}
        <img src="{{ include.image }}" alt="{{ include.title }}">
    {% endif %}

    {% if include.type %}
        <div class="post-type">
            {{ include.type }}
        </div>
    {% endif %}

    <h3>{{ include.title }}</h3>

    {% if include.description %}
        <p>{{ include.description }}</p>
    {% endif %}

    {% if include.button_url %}
        <a href="{{ include.button_url }}">
            Leer más
        </a>
    {% endif %}

</article>
