<a class="card product-card" href="{{ include.url }}">

    {% if include.image %}
        <img src="{{ include.image }}" alt="{{ include.title }}">
    {% endif %}

    {% if include.type %}
        <div class="product-type">
            {{ include.type }}
        </div>
    {% endif %}

    <h3>{{ include.title }}</h3>

    {% if include.description %}
        <p>{{ include.description }}</p>
    {% endif %}

    <span class="card-arrow">→</span>

</a>
