{% assign toc = include.items %}

<nav id="contenido" class="table-of-contents">

    <h3>Contenido</h3>

    <ul>
        {% for item in toc %}
            <li>
                <a href="{{ item.url }}">
                    {{ item.title }}
                </a>
            </li>
        {% endfor %}
    </ul>

</nav>
