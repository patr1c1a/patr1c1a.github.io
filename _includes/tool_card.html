<article class="tool-card">

    <div class="tool-image">
        <img src="{{ include.image }}" alt="{{ include.title }}">
    </div>

    <div class="tool-content">
        <h3>{{ include.title }}</h3>
        <p>{{ include.description }}</p>
        <a href="{{ include.url }}">
            {{ include.button }} →
        </a>
    </div>

</article>
